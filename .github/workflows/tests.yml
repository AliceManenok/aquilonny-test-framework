name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # "Run workflow" button on GitHub
  schedule:
    - cron: "0 3 * * *"  # every night at 03:00 UTC

concurrency:  # a newer push to the same branch cancels the run that is now outdated
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pre-commit run --all-files --show-diff-on-failure

  api-tests:
    needs: lint  # starts only after lint has passed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:  # no .env on the runner: Settings reads these environment variables instead
      API_USERNAME: ${{ secrets.API_USERNAME }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run API and settings tests
        run: >-
          python -m pytest -m "not ui" -n auto --reruns 1
          --junitxml=reports/api-junit.xml
          --html=reports/api-report.html --self-contained-html
      - name: Upload API report
        if: always()  # the report will be created always
        uses: actions/upload-artifact@v7
        with:
          name: api-report
          path: reports/

  ui-tests:
    needs: lint  # waits for lint only, so it runs in parallel with api-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:  # Settings needs the API login for every test, UI tests included
      API_USERNAME: ${{ secrets.API_USERNAME }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Install Chromium and its system libraries
        run: python -m playwright install --with-deps chromium
      - name: Run UI tests
        run: >-
          python -m pytest -m ui -n auto --reruns 1
          --junitxml=reports/ui-junit.xml
          --html=reports/ui-report.html --self-contained-html
      - name: Upload UI report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-report
          path: reports/
      - name: Upload traces and screenshots of failed tests
        if: failure()  # only when something failed: that is when traces are needed
        uses: actions/upload-artifact@v7
        with:
          name: ui-traces
          path: test-results/
