name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # "Run workflow" button on GitHub
  schedule:
    - cron: "0 3 * * *"  # every night at 03:00 UTC

concurrency:  # a newer push to the same branch cancels the run that is now outdated
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pre-commit run --all-files --show-diff-on-failure

  api-tests:
    needs: lint  # starts only after lint has passed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:  # no .env on the runner: Settings reads these environment variables instead
      API_USERNAME: ${{ secrets.API_USERNAME }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run API and settings tests
        run: >-
          python -m pytest -m "not ui" -n auto --reruns 1
          --junitxml=reports/api-junit.xml
          --html=reports/api-report.html --self-contained-html
      - name: Upload API report
        if: always()  # the report matters most when tests have failed
        uses: actions/upload-artifact@v7
        with:
          name: api-report
          path: reports/
