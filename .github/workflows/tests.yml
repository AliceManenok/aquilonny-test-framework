name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # "Run workflow" button on GitHub
  schedule:
    - cron: "0 3 * * *"  # every night at 03:00 UTC

concurrency:  # a newer push to the same branch cancels the run that is now outdated
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pre-commit run --all-files --show-diff-on-failure
