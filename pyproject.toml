[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--browser=chromium",
    "--tracing=retain-on-failure",
    "--screenshot=only-on-failure",
]
markers = [
    "api: API tests, no browser needed",
    "ui: UI tests that run in a browser",
    "smoke: critical checks to run on every pull request",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
